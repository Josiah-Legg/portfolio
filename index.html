<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Josiah Legg — designer and developer building digital products focused on clarity, craft, and things that feel good to use.">

  <!-- Set theme before paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Open Graph / social preview. TODO: set og:image to a full URL of a 1200x630
       image (e.g. https://yourdomain.com/og-image.png) and add that image file. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Josiah Legg | Portfolio">
  <meta property="og:description" content="Designer and developer building digital products focused on clarity, craft, and things that feel good to use.">
  <meta property="og:image" content="/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <title>Josiah Legg | Portfolio Home</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="header-row">
      <a href="/" class="logo" aria-label="Josiah Legg | Portfolio" aria-current="page">
        <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <!-- circle place holder -->
            <circle cx="50" cy="50" r="20" />
          </g>
        </svg>
        <span class="logo-text">Josiah Legg</span>
      </a>

      <div class="header-controls">
        <button class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        </button>
        <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
          <svg width="16" height="10" viewBox="0 0 16 10">
            <rect y="0.908" width="16" height="1.5" rx="0.5"></rect>
            <rect y="8.408" width="16" height="1.5" rx="0.5"></rect>
          </svg>
        </button>
      </div>
    </div>

    <nav class="site-nav" aria-label="Primary">
      <span class="nav-dot" aria-hidden="true"></span>
      <ul role="list">
        <li><a href="projects/" class="nav-link">Projects</a></li>
        <li><a href="about/" class="nav-link">About</a></li>
        <li><a href="#" class="nav-link">Writing</a></li>
        <li>
          <a href="#" class="nav-link external" target="_blank" rel="noopener">
            <span>Resume</span>
            <svg width="8" height="8" viewBox="0 0 8 8" class="external-arrow" aria-hidden="true">
              <path d="M0.772727 8L0 7.22727L6.13636 1.09091H0.727273V0H8V7.27273H6.90909V1.86364L0.772727 8Z" />
            </svg>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    <section class="hero">
      <p class="hero-eyebrow">Designer &amp; Developer</p>
      <h1 class="hero-title">Building things<br>for the web.</h1>
      <p class="hero-body">I design and build digital products - focused on clarity, craft, and things that feel good to use.</p>
    </section>
  </main>

  <script src="scripts/main.js" defer></script>
</body>

</html>
