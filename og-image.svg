<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="Josiah Legg — Designer and Developer">
  <defs>
    <!-- For an exact match, convert to PNG in a browser-based renderer so the
         web font and blend modes resolve. Falls back to a geometric sans. -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&amp;display=swap');
      .name {
        font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
    </style>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" />
    </filter>
  </defs>

  <!-- Background (light theme) -->
  <rect width="1200" height="630" fill="#fefae7" />

  <!-- Lockup: aperture mark + name, centered -->
  <g transform="translate(273 261) scale(4.5)" fill="none" stroke="#0f0d08"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10" />
    <line x1="14.31" y1="8" x2="20.05" y2="17.94" />
    <line x1="9.69" y1="8" x2="21.17" y2="8" />
    <line x1="7.38" y1="12" x2="13.12" y2="2.06" />
    <line x1="9.69" y1="16" x2="3.95" y2="6.06" />
    <line x1="14.31" y1="16" x2="2.83" y2="16" />
    <line x1="16.62" y1="12" x2="10.88" y2="21.94" />
  </g>
  <text class="name" x="417" y="315" font-size="92" fill="#0f0d08"
        dominant-baseline="central">Josiah Legg</text>

  <!-- Grain overlay on top of everything, matching the site's two-layer texture -->
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.5" style="mix-blend-mode: multiply" />
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.4" style="mix-blend-mode: screen" />
</svg>
